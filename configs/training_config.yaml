# Go2 locomotion, v2 training configuration.
#
# Structure mirrors the code: `environment` maps onto Go2Env's constructor,
# `reward.weights` onto envs/rewards.py's registry, `commands` onto
# envs/commands.py. Anything you can ablate is in here rather than in code.
#
# Weight convention: every reward weight is "per second". The environment
# multiplies the weighted sum by the control period dt, so changing the control
# rate does not silently rescale the objective. Positive weight = carrot,
# negative = stick.

environment:
  xml_path: "mujoco_menagerie/unitree_go2/scene.xml"

  # 2 ms physics step x 10 = 50 Hz control. v1 ran at 25 Hz (decimation 20),
  # which is half the field standard and, combined with the once-per-control-
  # step PD evaluation, produced most of the visible judder.
  decimation: 10

  # Joint offset in radians at |action| = 1.
  #
  # Sized from a measurement, not a convention. Pure kinematics say a 0.25 rad
  # offset can retract a foot 5.9 cm toward the trunk - apparently plenty for a
  # trot, which needs 3-5 cm of clearance. But the trunk is not fixed: while two
  # legs retract, the other two carry the whole robot and sag further, and the
  # body drops by almost exactly as much as the swing foot rises. A scripted
  # open-loop trot at kp=40, scale=0.25 achieved only 0.12 s of air time.
  #
  # Raising the scale and kp gives the policy headroom to extend the stance legs
  # and retract the swing legs at the same time, which is what a real gait does.
  # Same script, same amplitudes, with stance extension added: air time
  # 0.12 s -> 0.24 s and schedule match 0.61 -> 0.74.
  #
  # The scale also sets STRIDE LENGTH, which is the binding constraint on speed.
  # During stance the foot is planted and the body moves over it, so with no
  # flight phase v_max = stride x frequency. Measured fore-aft foot excursion:
  # 0.25 -> 19cm, 0.30 -> 22cm, 0.40 -> 29cm, 0.50 -> 36cm. At 0.40 the robot
  # can reach 0.58 m/s at 2 Hz and 0.87 m/s at 3 Hz. Going higher is tempting
  # but 0.45 puts the PD offset torque (kp x scale = 24.8 Nm) past the hip and
  # thigh actuator limit of 23.7 Nm. See docs/14-debugging-log.md, B20.
  action_scale: 0.40

  # Joint-space PD gains. Measured, not guessed. Standing sag under zero action
  # from the 0.27 m nominal pose: 7.4 cm at kp=20, 2.8 cm at kp=40, 1.4 cm at
  # kp=60. Sag matters more than it looks - it is subtracted directly from the
  # foot clearance available during swing (see action_scale above). kp=55 keeps
  # sag near 1.5 cm without becoming so stiff that the policy starts exploiting
  # contact impulses no real actuator could produce (which begins around kp=80).
  kp: 55.0
  kd: 1.4

  max_episode_steps: 1000        # 20 s at 50 Hz
  min_base_height: 0.12
  max_pitch_roll: 0.8            # rad, checked via projected gravity
  reset_noise_scale: 0.1

  # Exponential kernel widths for the two tracking rewards. Smaller = fussier.
  #
  # These are not arbitrary. exp(-e^2/sigma) is what a policy earns at tracking
  # error e, so sigma decides how much reward a robot gets *for doing nothing*.
  # Measured over the initial command ranges below, a perfectly stationary robot
  # collects 49% of the linear-tracking term at sigma=0.20, and 74% at
  # sigma=0.25 with the narrower ranges this config originally shipped. The
  # second number is a standing local optimum, and a 500k-step run fell into it
  # exactly as the arithmetic predicts (see docs/13-training-diagnostics.md).
  lin_vel_sigma: 0.20
  ang_vel_sigma: 0.25

  # Robustness. Domain randomisation is on by default in v2; it costs a little
  # asymptotic speed and buys a policy that does not fall over when anything
  # about the world differs from the nominal model.
  randomize_dynamics: true
  push_enabled: true
  push_interval_s: [3.0, 7.0]
  push_duration_s: 0.15
  push_force: [-40.0, 40.0]      # N, applied to the trunk
  obs_noise_scale: 0.0           # raise for sim-to-real work; see docs/16

commands:
  # Which gaits the sampler may ask for. Add "pace"/"bound"/"walk" here to train
  # a multi-gait policy; the phase clock in the observation is what lets one
  # network serve all of them.
  gaits: ["trot"]
  stand_probability: 0.10        # explicit "hold still" mode
  # Speed feasibility. Sampling speed and gait frequency independently produces
  # commands the robot cannot satisfy at that frequency, and an infeasible
  # command is worse than useless - the exponential tracking kernel saturates,
  # so the policy gets no gradient and the command becomes noise in the
  # observation. The sampler clamps every command to
  #
  #     v_max = min(max_speed_per_hz * f, max_speed) * feasibility_margin
  #
  # These constants are MEASURED, by driving a scripted open-loop trot at each
  # (action_scale, frequency) and recording the best speed it reaches:
  #
  #     scale   1.5Hz  2.0Hz  2.5Hz  3.0Hz
  #      0.30    0.52   0.62   0.65   0.69
  #      0.40    0.57   0.94   1.05   1.08     <- current action_scale
  #
  # A purely kinematic sweep of stance-foot travel gives 0.29 m of stride, which
  # predicts 0.87 m/s at 3 Hz - a useful LOWER bound, but too conservative,
  # because body pitch, foot roll on the sphere, and dynamic effects add stride
  # the static sweep cannot see. Trusting the static number would have capped
  # the robot below what it can do; trusting an aspirational number (the config
  # previously asked for 1.5 m/s) starves it of gradient. Measure instead.
  max_speed_per_hz: 0.40         # m/s per Hz of gait frequency
  max_speed: 1.0                 # absolute ceiling, m/s
  feasibility_margin: 0.85       # leave the policy somewhere to actually reach
  resample_interval_s: 5.0       # also resample mid-episode

  # Curriculum start. Wider than you might expect, and deliberately so: the
  # curriculum's job is to make the task learnable, not to make it easy. If the
  # commands are so small that standing still nearly satisfies them, there is no
  # gradient toward walking and the policy never leaves the standing optimum.
  # At these ranges a stationary robot scores 0.57 on the tracking score against
  # a promotion threshold of 0.85, which leaves real headroom to climb.
  initial:
    lin_vel_x: [-0.5, 0.85]
    lin_vel_y: [-0.3, 0.3]
    ang_vel_yaw: [-0.8, 0.8]
    # The initial frequency range is wide on purpose. Speed is bounded by
    # stride x frequency, so a narrow low-frequency band would cap the
    # commanded speed so low that standing still nearly satisfies it - the
    # trap described in docs/10-reward-engineering.md, 10.4. Measured
    # do-nothing tracking score at these ranges: 0.61, against a promotion
    # threshold of 0.85.
    gait_frequency: [1.8, 3.0]
    base_height: [0.29, 0.31]

  # Curriculum end: the full omnidirectional envelope.
  # Set AT the measured limit: min(0.40 x 3.0, 1.0) x 0.85 = 0.85 m/s. The
  # sampler clamps to that anyway, so a wider range here would not be wrong -
  # it would just be a number that never means anything, which is the kind of
  # latent inconsistency this repository exists to remove. To go faster, raise
  # action_scale, re-measure, and re-run `make check`.
  final:
    lin_vel_x: [-0.70, 0.85]
    lin_vel_y: [-0.40, 0.40]
    ang_vel_yaw: [-1.5, 1.5]
    gait_frequency: [1.5, 3.0]
    base_height: [0.27, 0.34]

curriculum:
  enabled: true
  # Thresholds on the normalised tracking score (1.0 = perfect tracking).
  # These are set from a measurement, not taste: at the *initial* narrow command
  # ranges a policy that does nothing at all already scores about 0.70, because
  # exp(-0.3^2/0.25) is 0.70 and the commands are small. A threshold of 0.75
  # would therefore promote a motionless robot. 0.85 corresponds to a mean
  # tracking error of ~0.20 m/s, which requires actually walking.
  threshold: 0.85
  decay_threshold: 0.55
  step: 0.05                     # level change per rollout

reward:
  weights:
    # --- task ---
    track_lin_vel_xy: 1.5
    track_ang_vel_yaw: 0.75
    # gait_phase is weighted comparably to velocity tracking on purpose. It is
    # the only DENSE signal that pays for lifting a foot: velocity tracking
    # rewards the result of walking, which the policy cannot discover until it
    # is already walking, and feet_air_time only pays at touchdown, so it is
    # exactly zero for a robot that has never taken a step. The phase reward is
    # what breaks that chicken-and-egg.
    gait_phase: 1.5              # replaces v1's time-blind contact reward
    # feet_clearance is the term that actually makes stepping DISCOVERABLE.
    # gait_phase compares a binary contact flag against the schedule, so its
    # gradient is exactly zero until a foot physically breaks contact - which is
    # the gap a policy that has never stepped must cross. Foot height is
    # continuous, so this pulls the swing foot up from the first millimetre.
    # A 1.1M-step run stalled in the standing optimum without it.
    feet_clearance: -30.0
    # Credit saturates at the SCHEDULED swing time rather than being offset by
    # a constant 0.5 s. With a commanded gait frequency the constant-offset form
    # (inherited from legged_gym) is negative for every correctly-timed step:
    # at 2 Hz, duty 0.5, swing is 0.25 s, so each touchdown scored -0.25 and a
    # perfect trot came to -0.08/step against +0.03 for standing still. The
    # reward made the target behaviour worse than doing nothing.
    feet_air_time: 1.0           # forces real strides, not a shuffle
    alive: 0.25                  # small: v1's 0.5 taught it to stand still
    # --- regularisation ---
    lin_vel_z: -2.0
    ang_vel_xy: -0.05
    orientation: -1.0
    base_height: -5.0
    torques: -0.0002
    joint_acceleration: -0.00000025
    action_rate: -0.01
    joint_limits: -10.0
    collision: -1.0
    feet_slip: -0.05
    stand_still: -0.5

training:
  algorithm: "PPO"
  total_timesteps: 50_000_000
  n_envs: 16
  seed: 0

  learning_rate: 3.0e-4
  lr_schedule: "linear"          # decay to 0 over training; "constant" to disable
  n_steps: 512                   # x 16 envs = 8192 transitions per rollout
  batch_size: 2048               # 4 minibatches per epoch, not v1's 256
  n_epochs: 5
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.002                # v1's 0.01 keeps the policy too noisy to trot
  vf_coef: 0.5
  max_grad_norm: 1.0
  target_kl: 0.02                # early-stop an epoch that moves too far
  policy: "MlpPolicy"
  policy_kwargs:
    net_arch: [512, 256, 128]
    log_std_init: -1.0           # start with ~0.37 rad std, not 1.0

logging:
  log_dir: "logs/"
  model_dir: "models/"
  save_freq: 500000
  eval_freq: 200000
  n_eval_episodes: 10
  tensorboard_log: "logs/tensorboard/"
